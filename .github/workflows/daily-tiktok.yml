name: Daily TikTok video

on:
  # Daily schedule turned off: the channel now runs the mini-series only (series.yml).
  # To turn it back on, restore:  schedule: - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      niche:
        description: "Force a niche (business, facts, georgia, psychology, money, motivation) - empty = auto"
        required: false
      script:
        description: "Force a script id from scripts/bank.json (e.g. S005) - empty = auto"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-tiktok
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tiktok
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tiktok/render/package-lock.json

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji
          pip install -r requirements.txt
          cd render && npm ci && npx remotion browser ensure

      - name: Generate and send video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
          ELEVENLABS_VOICES: ${{ vars.ELEVENLABS_VOICES }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY || secrets.GEMINI_APP }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOCK_NICHE: ${{ vars.LOCK_NICHE }}
          PRIORITY_NICHE: ${{ vars.PRIORITY_NICHE || 'manipulation' }}
          IN_NICHE: ${{ inputs.niche }}
          IN_SCRIPT: ${{ inputs.script }}
        run: |
          ARGS=()
          [ -n "$IN_NICHE" ] && ARGS+=(--niche "$IN_NICHE")
          [ -n "$IN_SCRIPT" ] && ARGS+=(--script "$IN_SCRIPT")
          python generate.py "${ARGS[@]}"

      - name: Keep a copy of the video in the run (backup if Telegram fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video
          path: tiktok/output/*.mp4
          retention-days: 14

      - name: Save experiment log
        run: |
          git config user.name "tiktok-bot"
          git config user.email "tiktok-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Log daily TikTok video" || exit 0
          git pull --rebase -q && git push
